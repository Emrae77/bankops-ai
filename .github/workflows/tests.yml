name: Validate BankOps AI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Generate synthetic demo dataset
        run: python -m scripts.setup_demo
      - name: Compile source files
        run: python -m compileall -q app.py src scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline smoke check
        run: python -m scripts.smoke_check
